name: CI

on:
  push:
  pull_request:

jobs:
  mock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run mock API tests
        run: mvn -B verify -Pmock
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-test-reports
          path: target/surefire-reports/

  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Spring Boot and Postgres API tests
        run: mvn -B verify -Papp
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-reports
          path: target/surefire-reports/
